# =============================================================================
# MODE B — DETERMINISTIC + LLM TICKET TAIL
# =============================================================================
# Flow: Resource / Content Not Opening (UC-04)
#
# Covers:
#   - Mobile App vs Web Browser detection
#   - Mobile App unsupported guidance & Desktop Site fallback
#   - YouTube resource configuration checks (Streaming, Registration, Artifact URLs)
#   - YouTube network restriction checks
#   - SCORM/Other format escalation
#
# APIs used:
#   POST /api/course/private/v4/user/enrollment/list/{user_id}
#   GET  /api/content/v2/read/{course_id}
#   POST /api/composite/v4/search
#   GET  /api/content/v1/read/{resource_id}
# =============================================================================

flow_id: RESOURCE_NOT_OPENING
flow_type: deterministic_with_llm_fallback
version: 2

metadata:
  category:         course
  menu_label:       "📂 Resource not opening"
  menu_group:       "Content Related Issue"
  menu_group_order: 2
  menu_order:       4
  classification:   Incident
  default_portal:   Learner Portal
  default_priority: P3
  default_severity: Sev 3

enabled_channels: [web]

classification:
  triggers:
    - "resource not opening"
    - "content not loading"
    - "video not playing"
    - "pdf not opening"
    - "scorm not working"
    - "youtube not loading"
    - "assessment not opening"
    - "content not working"
    - "module not opening"

entry_node: ask_device_type

imports:
  - _terminal
  - fragment: _zoho_ticket
    with:
      cf_category:     course
      cf_sub_category: resource_not_opening
      cf_flow_id:      RESOURCE_NOT_OPENING

nodes:
  # ===========================================================================
  # 1. Identify User Device (User Selection)
  # ===========================================================================
  - id: ask_device_type
    type: message
    prompt:
      text: "Are you accessing iGOT Karmayogi through a mobile application or a web browser?"
    quick_replies:
      - { id: mobile, label: "📱 Mobile Application" }
      - { id: web,    label: "💻 Web Browser" }
    disable_input: true
    on_reply:
      save_to: collected.device_type
      mobile: mobile_app_guidance
      web:    shared_pick_course

  # ===========================================================================
  # CASE 1: Mobile Application
  # ===========================================================================
  - id: mobile_app_guidance
    type: resolution
    prompt:
      text: |
        It looks like this resource isn't supported on the mobile application. Please try accessing the course using a desktop or laptop browser instead.
    steps:
      - "Open Google Chrome browser on your desktop or laptop."
      - "In the address bar, type **iGOT Karmayogi** and press Enter."
      - "Login using your registered credentials."
      - "Search for the course in which you are enrolled."
      - "Click **Resume** and try opening the video or resource again."
    follow_up:
      text: "Would you like to try this on a desktop, or do you want to continue troubleshooting on your mobile device?"
      quick_replies:
        - { id: desktop, label: "💻 I'll try on desktop" }
        - { id: mobile,  label: "📱 Continue on mobile" }
    on_reply:
      desktop: satisfied
      mobile:  mobile_desktop_mode_guidance

  - id: mobile_desktop_mode_guidance
    type: resolution
    prompt:
      text: "Please try using Desktop Mode on your mobile browser."
    steps:
      - "Open **Google Chrome** browser on the mobile device."
      - "Click on the **three dots** at the top right corner of the browser."
      - "Enable **Desktop Site** / **Desktop Mode**."
      - "In the address bar, type **iGOT Karmayogi**."
      - "Login using the registered credentials."
      - "Search for the course."
      - "Click **Resume** and try opening the resource again."
    follow_up:
      text: "Did the resource open successfully in Desktop Mode?"
      quick_replies:
        - { id: yes, label: "✅ Yes, it opened" }
        - { id: no,  label: "❌ No, still not opening" }
    on_reply:
      yes: satisfied
      no:  mobile_collect_device_details

  - id: mobile_collect_device_details
    type: collect
    prompts:
      - { field: collected.mobile_model,  text: "Please share your Mobile Device Model (e.g., Samsung Galaxy S21):" }
      - { field: collected.app_version,   text: "Please share your Mobile Application Version (if known):", optional: true }
    next: shared_pick_course

  # ===========================================================================
  # CASE 2: Web Browser / Shared API Path
  # ===========================================================================
  # Step 1: Select course from enrollment list
  - id: shared_pick_course
    type: collect
    prompt:
      text: "Please select the course that has the resource not opening:"
      title: "Select Course"
    field:
      name: collected.course_id
      type: select
    dynamic_options:
      source: api
      integration: karmayogi
      request:
        method: POST
        url: "/api/course/private/v4/user/enrollment/list/{{ ctx.user_id_hash }}"
        body:
          request:
            retiredCoursesEnabled: true
            status: ["In-Progress", "Completed"]
      response_mapping:
        list_path:       "$.courses"
        id_field:        courseId
        label_field:     courseName
        sub_label_field: completionPercentage
        extra_fields:
          - { from: courseName,        to: collected.course_name }
          # Captured from this same call (no separate API round-trip needed) so
          # we can tell, once a resource is picked, whether it's already marked
          # complete server-side before offering to raise a ticket.
          - { from: langContentStatus, to: collected.resource_completed_ids, transform: extract_completed_ids }
          - { from: batchId,           to: collected.batch_id }
          - { from: batches,           to: collected.batch_id,              transform: extract_batch_id }
      filter_items:
        field: content.courseCategory
        operator: neq
        value: "Learning Pathway"
      search:     { enabled: true, placeholder: "Search your enrolled courses..." }
      pagination: { enabled: true, page_size: 10 }
      cache_ttl:  300
      empty_message: |
        You do not have any enrolled courses or programs at the moment.

        Please enrol in a course on the iGOT Karmayogi portal and try again.
      on_empty:   satisfied
    next: api_fetch_course_content

  # Step 2: Fetch the course content and check for resource IDs (Leaf Nodes).
  # Per SOP, there is no hierarchy API in this flow — we just read the content
  # and check. GET /api/content/v2/read/ returns a flattened leafNodes[]
  # covering nested CourseUnit resources, with children[] as a defensive
  # fallback if leafNodes is ever absent.
  - id: api_fetch_course_content
    type: api_call
    integration: karmayogi
    request:
      method: GET
      url: "/api/content/v2/read/{{ ctx.collected.course_id }}"
    response_mapping:
      - from: "$.content.leafNodes"
        to: collected.all_resource_ids
      - from: "$.content.children" # Defensive fallback if leafNodes is ever absent
        to: collected.all_child_ids
        transform: extract_child_course_ids
    on_success: branch_resource_ids_found
    on_error:
      any: api_error_fallback

  # Guard: /api/composite/v4/search silently ignores an EMPTY identifier filter
  # and returns unrelated content from across the whole platform instead of
  # erroring or returning nothing. Never let that happen — if the content
  # read above found no leaf/child IDs at all, go straight to the "no
  # resources" message instead of searching with an empty filter.
  - id: branch_resource_ids_found
    type: branch
    rules:
      - if: >
          (ctx.collected.all_resource_ids != None and len(ctx.collected.all_resource_ids) > 0)
          or (ctx.collected.all_child_ids != None and len(ctx.collected.all_child_ids) > 0)
        then: shared_pick_resource
    default: no_resources_found

  # Step 3: Select the resource from a searchable list
  - id: shared_pick_resource
    type: collect
    prompt:
      text: "I found the following resources in **{{ ctx.collected.course_name }}**. Which one is not opening?"
      title: "Select Resource"
    field:
      name: collected.resource_id
      type: select
    dynamic_options:
      source: api
      integration: karmayogi
      request:
        method: POST
        url: "/api/composite/v4/search"
        body:
          request:
            filters:
              identifier: "{{ ctx.collected.all_resource_ids or ctx.collected.all_child_ids or [] }}"
            isSecureSettingsDisabled: true
            fields: ["identifier", "name", "mimeType"]
            limit: 1000
      response_mapping:
        list_path:       "$.content"
        id_field:        identifier
        label_field:     name
        extra_fields:
          - { from: name,     to: collected.resource_name }
          - { from: mimeType, to: collected.resource_mime_type }
      # Composite search can miss some known resource IDs (e.g. Draft/Retired
      # status) and just silently drop them from $.content — which here means
      # they'd never appear as a selectable option at all. For any ID present
      # in all_resource_ids/all_child_ids but absent from the composite search
      # result, fetch it individually via content/v1/read and add it in.
      fallback_missing_ids:
        ids_ctx_keys: ["collected.all_resource_ids", "collected.all_child_ids"]
        read_path:   "/api/content/v1/read/{id}"
        label_field: name
        extra_fields:
          - { from: name,     to: collected.resource_name }
          - { from: mimeType, to: collected.resource_mime_type }
      search: { enabled: true, placeholder: "Search for a video or module name..." }
      pagination: { enabled: true, page_size: 15 }
      on_empty:   no_resources_found
    next: branch_device_check_after_resource

  - id: branch_device_check_after_resource
    type: branch
    rules:
      - if: "ctx.collected.device_type == 'mobile'"
        then: mobile_issue_summary
    default: branch_resource_type_step

  - id: mobile_issue_summary
    type: ticket_confirm
    prompt:
      text: |
        **Summary of Request:**
        You reported that the resource is not opening on your mobile device even after switching to Desktop Mode. You would like us to investigate this issue further.
        
        • **Course:** {{ ctx.collected.course_name }}
        • **Resource:** {{ ctx.collected.resource_name }}
        • **Mobile Model:** {{ ctx.collected.mobile_model }}
        {% if ctx.collected.app_version %}• **App Version:** {{ ctx.collected.app_version }}{% endif %}

        Please review the details above and confirm whether they are correct.
    on_confirm: resource_auto_ticket
    on_cancel: satisfied

  - id: branch_resource_type_step
    type: branch
    rules:
      - { if: "ctx.collected.resource_mime_type in ['text/x-url']",
          then: api_youtube_read }
    default: branch_resource_type_after_status

  - id: branch_resource_type_after_status
    type: branch
    rules:
      - { if: "ctx.collected.resource_mime_type == 'application/vnd.ekstep.html-archive'",
          then: scorm_format_message }
    default: other_format_message



  # Step 4: YouTube URL Configuration Check
  - id: api_youtube_read
    type: api_call
    integration: karmayogi
    request:
      method: GET
      url: "/api/content/v1/read/{{ ctx.collected.resource_id }}"
    response_mapping:
      - { from: "$.content.streamingUrl", to: collected.streaming_url }
      - { from: "$.content.artifactUrl",  to: collected.artifact_url }
      - { from: "$.content.previewUrl",   to: collected.preview_url }
    on_success: branch_youtube_config
    on_error:
      any: api_error_fallback

  - id: branch_youtube_config
    type: branch
    rules:
      - if: "ctx.collected.streaming_url != None and ctx.collected.streaming_url == ctx.collected.artifact_url and ctx.collected.streaming_url == ctx.collected.preview_url"
        then: ask_youtube_restricted
    default: youtube_config_message

  # ===========================================================================
  # CASE 2A: YouTube Resource
  # ===========================================================================

  - id: ask_youtube_restricted
    type: message
    prompt:
      text: "Is YouTube access restricted or blocked in your system or organization's network?"
    quick_replies:
      - { id: yes_restricted, label: "🚫 Yes, it is restricted" }
      - { id: no_open,        label: "✅ No, it is not restricted" }
    disable_input: true
    on_reply:
      save_to: collected.youtube_restricted
      yes_restricted: youtube_restricted_guidance
      no_open:        youtube_unrestricted_message

  - id: youtube_restricted_guidance
    type: resolution
    prompt:
      text: |
        This content is YouTube-based, and it appears your organization blocks YouTube in desktop browsers.

        You can watch this video using the mobile application instead.
    steps:
      - "Open the **iGOT Karmayogi Mobile Application**."
      - "Login using your registered credentials."
      - "Search for the course."
      - "Click **Resume** and watch the video."
    next: satisfied

  - id: youtube_unrestricted_message
    type: ticket_confirm
    prompt:
      text: "This YouTube video requires further investigation. Would you like us to create a support ticket?"
    on_confirm: youtube_unrestricted_ticket
    on_cancel: satisfied

  - id: youtube_unrestricted_ticket
    type: ticket_confirm
    prompt:
      text: |
        **Summary of Request:**
        You reported that the YouTube resource is not opening despite YouTube not being restricted on your network. You would like us to investigate this issue further.

        • **Course:** {{ ctx.collected.course_name }}
        • **Resource:** {{ ctx.collected.resource_name }}

        Please review the details above and confirm whether they are correct.
    on_confirm: resource_auto_ticket
    on_cancel: satisfied

  - id: youtube_config_message
    type: ticket_confirm
    prompt:
      text: "There is a configuration issue with this YouTube video. Would you like us to create a support ticket?"
    on_confirm: youtube_config_issue
    on_cancel: satisfied

  - id: youtube_config_issue
    type: ticket_confirm
    prompt:
      text: |
        **Summary of Request:**
        You reported that the YouTube resource is not opening due to a possible configuration issue. You would like us to investigate this issue further.
        
        • **Course:** {{ ctx.collected.course_name }}
        • **Resource:** {{ ctx.collected.resource_name }}

        Please review the details above and confirm whether they are correct.
    on_confirm: resource_auto_ticket
    on_cancel: satisfied

  # Fallback for API failures
  - id: api_error_fallback
    type: ticket_confirm
    prompt:
      text: |
        I'm having trouble fetching your course or resource details right now.

        **Summary of Request:**
        You reported a resource/content opening issue and it could not be resolved through self-service steps. You would like us to investigate this issue further.

        • **Course:** {{ ctx.collected.course_name }}

        Please review the details above and confirm whether they are correct.
    on_confirm: resource_auto_ticket
    on_cancel: satisfied

  # ===========================================================================
  # CASE 2B: SCORM / Other Formats
  # ===========================================================================
  - id: scorm_format_message
    type: ticket_confirm
    prompt:
      text: "This SCORM module requires further investigation. Would you like us to create a support ticket?"
    on_confirm: scorm_format_issue
    on_cancel: satisfied

  - id: scorm_format_issue
    type: ticket_confirm
    prompt:
      text: |
        **Summary of Request:**
        You reported that a SCORM format resource is not opening. You would like us to investigate this issue further.

        • **Course:** {{ ctx.collected.course_name }}
        • **Resource:** {{ ctx.collected.resource_name }}

        Please review the details above and confirm whether they are correct.
    on_confirm: resource_auto_ticket
    on_cancel: satisfied

  - id: other_format_message
    type: ticket_confirm
    prompt:
      text: |
        {% set r_type = "content module" %}
        {% if ctx.collected.resource_mime_type == 'application/pdf' %}
        {% set r_type = "PDF document" %}
        {% elif ctx.collected.resource_mime_type == 'video/mp4' %}
        {% set r_type = "video file" %}
        {% elif ctx.collected.resource_mime_type == 'application/vnd.sunbird.questionset' %}
        {% set r_type = "assessment" %}
        {% endif %}
        This {{ r_type }} requires further investigation. Would you like us to create a support ticket?
    on_confirm: other_format_issue
    on_cancel: satisfied

  - id: other_format_issue
    type: ticket_confirm
    prompt:
      text: |
        {% set r_type = "a content module" %}
        {% if ctx.collected.resource_mime_type == 'application/pdf' %}
        {% set r_type = "a PDF document" %}
        {% elif ctx.collected.resource_mime_type == 'video/mp4' %}
        {% set r_type = "a video file" %}
        {% elif ctx.collected.resource_mime_type == 'application/vnd.sunbird.questionset' %}
        {% set r_type = "an assessment" %}
        {% endif %}
        **Summary of Request:**
        You reported that {{ r_type }} is not opening. You would like us to investigate this issue further.

        • **Course:** {{ ctx.collected.course_name }}
        • **Resource:** {{ ctx.collected.resource_name }}

        Please review the details above and confirm whether they are correct.
    on_confirm: resource_auto_ticket
    on_cancel: satisfied

  # ===========================================================================
  # Escalation
  # ===========================================================================
  - id: resource_auto_ticket
    type: transfer_llm
    auto_raise: silent
    llm_context:
      include_messages:  true
      include_collected: true
      include_flow_meta: true
    llm_directives:
      objective: |
        The user has a resource/content opening issue.
        Generate a Zoho support ticket.
        Subject: "Resource Not Opening — {{ ctx.collected.course_name | default('Course') }}"
        Description: include course name, resource name, channel ({{ ctx.channel }}), resource type, and email.
        If mobile device details (mobile model, app version) are provided, include them as well.
      key_facts:
        - { field: course_name,  label: "Course Name" }
        - { field: course_id,    label: "Course DO ID" }
        - { field: resource_name, label: "Resource Name" }
        - { field: resource_id,  label: "Resource DO ID" }
      priority_override: P3
    on_complete: confirm_ticket
    on_restart: ask_device_type

  # ---------------------------------------------------------------------------
  # Empty-state nodes
  # ---------------------------------------------------------------------------
  - id: no_resources_found
    type: message
    prompt:
      text: |
        We couldn't find any resources in the selected course.
    next: no_resources_found_ticket_confirm

  - id: no_resources_found_ticket_confirm
    type: ticket_confirm
    prompt:
      text: |
        This needs further investigation from our support team.

        **Summary of Request:**
        You reported a resource/content opening issue and no resources could be found in the selected course. You would like us to investigate this issue further.

        • **Course:** {{ ctx.collected.course_name }}

        Please review the details above and confirm whether they are correct.
    on_confirm: resource_auto_ticket
    on_cancel: satisfied
