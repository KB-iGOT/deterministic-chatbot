  # ═══════════════════════════════════════════════════════════════════════════
  # YP (YOUNG PROFESSIONAL) LOOKUP — shared fallback when no MDO Admin is found
  #   _yp_lookup fragment provides lookup_yp_contact
  #   key: collected.org_channel (channel field from the relevant profile read)
  #   on_success → yp_found_result
  #   on_error   → yp_not_found
  # ═══════════════════════════════════════════════════════════════════════════
  - id: yp_found_result
    type: message
    prompt:
      text: |
        Since the MDO Admin for your organisation isn't currently available in the system, please contact the concerned **Young Professional (YP)** for further assistance:

        • **YP Name:** {{ ctx.collected.yp_name }}
        • **YP Email ID:** {{ ctx.collected.yp_email }}
        {% if ctx.collected.yp_mobile %}
        • **YP Mobile:** {{ ctx.collected.yp_mobile }}
        {% endif %}
    next: satisfied

  - id: yp_not_found
    type: ticket_confirm
    prompt:
      text: |
        We checked, and found that there is currently no MDO Admin or YP contact available for your organisation to assist with this request.

        This needs further investigation from our support team. Would you like us to create a support ticket for this issue?
    on_confirm: yp_not_found_ticket_summary
    on_cancel: satisfied

  - id: yp_not_found_ticket_summary
    type: ticket_confirm
    prompt:
      text: |
        **Issue Identified:** Profile Update — No Admin or YP Contact Found

        **Summary of Request:**
        You reported a profile update issue, but there is currently no MDO Admin available to assist, and we could not locate a YP contact for your organisation either. You would like us to investigate this further.

        • **Organisation:** {{ ctx.collected.org_channel | default('Not identified') }}

        Please review the details above and confirm whether they are correct.
    on_confirm: yp_not_found_raise_ticket
    on_cancel: satisfied

  - id: yp_not_found_raise_ticket
    type: transfer_llm
    auto_raise: silent
    llm_context:
      include_messages: true
      include_collected: true
      include_flow_meta: true
    llm_directives:
      objective: |
        The user needs help with their iGOT profile, but no MDO Admin could be
        found to assist, and no YP/SPOC contact could be located for their organisation
        either — so the user has no self-service path to resolve this.
        Generate a Zoho support ticket so the support team can manually identify the
        correct contact and resolve the request.
        Subject: "Profile Update — No Admin or YP Contact Found"
        Description: include the organisation/channel and the specific profile issue the user needed help with.
        Keep to 1 turn.
      priority_override: P3
      ticket_tags: [profile_update, no_admin_or_yp_contact]
    on_complete: confirm_ticket
    on_restart: intake_menu

  # ═══════════════════════════════════════════════════════════════════════════
  # DISSATISFACTION HANDLING
  # ═══════════════════════════════════════════════════════════════════════════
  - id: track_dissatisfaction
    type: increment_and_branch
    counter: dissatisfaction_count
    rules:
      - { if: "ctx.counters.dissatisfaction_count < 2",  then: ask_reclassify }
      - { if: "ctx.counters.dissatisfaction_count >= 2", then: transfer_to_llm }
    default: transfer_to_llm

  - id: ask_reclassify
    type: message
    prompt:
      text: "Could you please specify what is still not working?"
    quick_replies:
      - { id: photo,   label: "Photo upload fails" }
      - { id: save,    label: "Save button not working" }
      - { id: missing, label: "I don't see the field to edit" }
      - { id: human,   label: "🆘 I need to talk to someone" }
    disable_input: false
    on_reply:
      save_to: collected.reclassify_choice
      photo:   re_diagnose
      save:    track_dissatisfaction
      missing: re_diagnose
      human:   transfer_to_llm

  # ═══════════════════════════════════════════════════════════════════════════
  # LLM TRANSFER — general fallback + ticket creation
  # ═══════════════════════════════════════════════════════════════════════════
  - id: transfer_to_llm
    type: transfer_llm
    auto_raise: silent
    llm_context:
      include_messages: true
      include_collected: true
      include_flow_meta: true
    llm_directives:
      objective: |
        The user needs help with their iGOT profile. They've been through deterministic
        guidance and are still stuck (or have a complex issue requiring API data).

        Your job:
        1. Acknowledge their concern briefly (one sentence, no over-apology).
        2. Identify the specific issue from the conversation history.
        3. If MDO contact details are needed, fetch them via the API.
        4. If a ticket is needed: draft a clear Zoho ticket, confirm with user, then create it.
        Keep to under 3 turns.
      priority_override: P3
      ticket_tags: [fallback_from_deterministic, profile_update]
    on_complete: confirm_ticket

  # ── API ERROR ESCALATION ──────────────────────────────────────────────────
  - id: escalate_api_error
    type: message
    prompt:
      text: "We couldn't fetch your profile data right now. We will raise a ticket so the team can investigate."
    next: transfer_to_llm

  # terminal nodes (satisfied, ticket_raised_end) are injected from _terminal fragment
